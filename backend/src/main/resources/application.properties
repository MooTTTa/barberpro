# Servidor
server.port=8080

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/barberpro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (troque em producao!)
jwt.secret=local-dev-secret-troque-em-producao
jwt.expiration=86400000

# WhatsApp (Evolution API)
whatsapp.api.url=http://localhost:8081
whatsapp.api.key=SUA_CHAVE_AQUI
whatsapp.instance=barberpro

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
